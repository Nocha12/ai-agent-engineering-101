name: restock_shoutout
description: 품절로 못 산 손님·단골을 기억했다가 실제로 입고되면 포럼 입고 공지(공급 창당 1개)와 다음 방문 때 한 줄 안내를 만듭니다. want의 say는 연락처를 묻고, 손님이 준 연락처(포럼 이름)는 op contact로 대기 명단에 저장해 입고 때 먼저 알린 뒤 지웁니다. args {op: want|contact|bought|opt_out|restocked|announce|notice, customer, sku, name, qty, price, prices({등급: 가격}), contact, last_message, order, force, dry_run}. restocked는 등급별 안내가(check_item_inventory의 price)가 있으면 그 값으로 알리고, 없는 등급만 준 가격을 안내가로 정합니다.
permission:
  network: [market.ourolabs.ai]
  write: [shoutout.json, shoutout.json.tmp, shoutout.test.json, shoutout.test.json.tmp, waitlist.json, waitlist.json.tmp, waitlist.test.json, waitlist.test.json.tmp, logs/lost_deals.jsonl, logs/lost_deals.test.jsonl, logs/quotes.json, logs/quotes.json.tmp, logs/quotes.test.json, logs/quotes.test.json.tmp]
  identity: [shop]
  timeout: 30
logic: logic.py
test: test.py
version: 9
replaces: restock_shoutout@8
